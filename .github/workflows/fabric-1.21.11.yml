name: Fabric 1.21.11
on:
  push:
    branches: [main]
    paths: ['src/**', 'tests/**', 'scripts/**', 'modpack/**', 'build.py', 'versions/1.21.11/**', '.github/workflows/fabric-1.21.11.yml']
  pull_request:
    paths: ['src/**', 'tests/**', 'scripts/**', 'modpack/**', 'build.py', 'versions/1.21.11/**', '.github/workflows/fabric-1.21.11.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fabric-1.21.11-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify installers and settings preservation
        run: |
          python tests/test_installer.py
          python tests/test_voicechat.py
          python tests/test_profile_migration.py
          python tests/test_updater.py
          python tests/test_patch_delivery.py
      - name: Build remapped client jar and run regressions
        working-directory: versions/1.21.11
        run: bash gradlew build --no-daemon --console=plain
      - name: Checksum
        working-directory: versions/1.21.11/build/libs
        run: sha256sum skyblock-toolkit-*+mc1.21.11.jar > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: skyblock-toolkit-fabric-1.21.11
          path: |
            versions/1.21.11/build/libs/skyblock-toolkit-*.jar
            versions/1.21.11/build/libs/SHA256SUMS.txt
          if-no-files-found: error
      - name: Publish in-game patch update
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish_patch.py --minecraft 1.21.11
