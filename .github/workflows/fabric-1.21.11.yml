name: Fabric 1.21.11
on:
  push:
    branches: [main]
    paths: ['src/**', 'tests/**', 'versions/1.21.11/**', '.github/workflows/fabric-1.21.11.yml']
  pull_request:
    paths: ['src/**', 'tests/**', 'versions/1.21.11/**', '.github/workflows/fabric-1.21.11.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build remapped client jar and run regressions
        working-directory: versions/1.21.11
        run: bash gradlew build --no-daemon --console=plain
      - name: Checksum
        working-directory: versions/1.21.11/build/libs
        run: sha256sum 'skyblock-toolkit-1.1.0+mc1.21.11.jar' > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: skyblock-toolkit-fabric-1.21.11
          path: |
            versions/1.21.11/build/libs/skyblock-toolkit-1.1.0+mc1.21.11.jar
            versions/1.21.11/build/libs/SHA256SUMS.txt
          if-no-files-found: error
